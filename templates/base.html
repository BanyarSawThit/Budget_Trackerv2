{% load static %}

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-16x16.png' %}">
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ===== COLOR SYSTEM - CHANGE THESE THREE COLORS ===== */
        :root {
            /* Budget Section - Purple theme */
            --budget-primary: #7f71bf;
            --budget-light: #b8b8ff;
            --budget-header: #3D167A70;

            /* Spending Section - Green theme */
            --spending-primary: #7cb342;
            --spending-light: #d5f7b9;
            --spending-header: #558b2f80;

            /* Deposit Section - Blue theme */
            --deposit-primary: #42a5f5;
            --deposit-light: #b9d1f7;
            --deposit-header: #1976d280;

            /* Income Section - Gold theme */
            --income-primary: #c89b3c;
            --income-light: #e7d7a8;
            --income-header: #a87c2f80;

            /* Neutral colors */
            --bg-page: #f8f7ff;
            --text-dark: #2c3e50;
            --border-color: #00000020;
        }

        /* ===== BASE STYLES ===== */
        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            padding-bottom: 80px; /* adjust once globally */
        }

        /* ===== CARD SYSTEM ===== */

        /* User Wrapper Card (background for user columns) */
        .card-user-wrapper {
            background-color: rgba(147, 129, 255, 0.08);
            border: 1px solid rgba(147, 129, 255, 0.2);
        }

        .card-user-wrapper .card-header {
            color: var(--budget-primary);
        }

        /* Budget Cards */
        .card-budget {
            background-color: var(--budget-light);
            border: none;
        }

        .card-budget .card-header {
            background-color: var(--budget-header);
            color: var(--text-dark);
            font-weight: 600;
        }

        .card-budget-primary {
            background-color: var(--budget-primary);
        }

        /* Spending Cards */
        .card-spending {
            background-color: var(--spending-light);
            border: none;
        }

        .card-spending .card-header {
            background-color: var(--spending-header);
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Deposit Cards */
        .card-deposit {
            background-color: var(--deposit-light);
            border: none;
        }

        .card-deposit .card-header {
            background-color: var(--deposit-header);
            color: var(--text-dark);
            font-weight: 600;
        }

        .card-deposit-primary {
            background-color: var(--deposit-primary);
        }

        /* Income Cards */
        .card-income {
            background-color: var(--income-light);
            border: none;
        }

        .card-income .card-header {
            background-color: var(--income-header);
            color: var(--text-dark);
            font-weight: 600;
        }

        .card-income-primary {
            background-color: var(--income-primary);
        }

        /* ===== RESPONSIVE TABLE FIXES ===== */

        /* Make tables scrollable on mobile */
        .table-responsive-mobile {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Reduce table padding on mobile */
        @media (max-width: 768px) {
            .table-budget tbody tr td,
            .table-deposit tbody tr td {
                padding: 0.5rem 0.5rem !important;  /* Reduced from 0.75rem 1rem */
                font-size: 0.875rem;  /* Slightly smaller font */
            }

            /* Make action buttons smaller on mobile */
            .table-budget .btn-sm,
            .table-deposit .btn-sm {
                font-size: 0.75rem;
                padding: 0.25rem 0.5rem;
            }
        }

        /* ===== TABLE STYLES ===== */

        .table-scroll {
            max-height: 150px;
            overflow-y: auto;
        }

        /* Budget Table Styles */
        .table-budget {
            background-color: transparent !important;
            margin-bottom: 0;
        }

        .table-budget tbody tr {
            background-color: var(--budget-light) !important;
        }

        .table-budget tbody tr:nth-child(even) {
            background-color: rgba(147, 129, 255, 0.3) !important;
        }

        .table-budget tbody tr td {
            background-color: transparent !important;
            padding: 0.75rem 1rem;
            border: none !important;
        }

        .table-budget tfoot tr {
            background-color: var(--budget-header) !important;
            border-top: 2px solid var(--budget-primary) !important;
        }

        /* ===== Spending Table Styles ===== */

        .table-spending {
            background-color: transparent !important;
            margin-bottom: 0;
        }

        .table-spending tbody tr {
            background-color: var(--spending-light) !important;
        }

        .table-spending tbody tr:nth-child(even) {
            background-color: rgba(124, 179, 66, 0.3) !important; /* lighter green stripe */
        }

        .table-spending tbody tr td {
            background-color: transparent !important;
            padding: 0.75rem 1rem;
            border: none !important;
        }

        .table-spending tfoot tr {
            background-color: var(--spending-header) !important;
            border-top: 2px solid var(--spending-primary) !important;
        }

        .table-spending tfoot tr td {
            background-color: transparent !important;
            border: none !important;
        }

        /* Deposit Table Styles */
        .table-deposit {
            background-color: transparent !important;
            margin-bottom: 0;
        }

        .table-deposit tbody tr {
            background-color: var(--deposit-light) !important;
        }

        .table-deposit tbody tr:nth-child(even) {
            background-color: rgba(66, 165, 245, 0.3) !important;
        }

        .table-deposit tbody tr td {
            background-color: transparent !important;
            padding: 0.75rem 1rem;
            border: none !important;
        }

        .table-deposit tfoot tr {
            background-color: var(--deposit-header) !important;
            border-top: 2px solid var(--deposit-primary) !important;
        }

        .table-deposit tfoot tr td {
            background-color: transparent !important;
            border: none !important;
        }

        /* ===== Income Table Styles ===== */

        .table-income {
            background-color: transparent !important;
            margin-bottom: 0;
        }

        .table-income tbody tr {
            background-color: var(--income-light) !important;
        }

        .table-income tbody tr:nth-child(even) {
            background-color: rgba(249, 168, 37, 0.3) !important; /* lighter gold stripe */
        }

        .table-income tbody tr td {
            background-color: transparent !important;
            padding: 0.75rem 1rem;
            border: none !important;
        }

        .table-income tfoot tr {
            background-color: var(--income-header) !important;
            border-top: 2px solid var(--income-primary) !important;
        }

        .table-income tfoot tr td {
            background-color: transparent !important;
            border: none !important;
        }

        /* ===== BUTTON STYLES ===== */

        /* Budget Buttons */
        .btn-primary {
            background-color: var(--budget-primary);
            border: none;
        }

        .btn-light {
            background-color: var(--budget-light);
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--budget-primary);
            opacity: 0.9;
        }

        .btn-light:hover {
            background-color: var(--budget-light);
            opacity: 0.9;
        }


        /* Deposit Buttons */
        .btn-deposit {
            background-color: var(--deposit-primary);
            border: none;
        }

        .btn-deposit:hover {
            background-color: var(--deposit-primary);
            opacity: 0.9;
        }


        /* Income Buttons */
        .btn-income {
            background-color: var(--income-primary);
            border: none;
            color: #fff;
        }

        .btn-income-light {
            background-color: var(--income-light);
            border: none;
        }

        .btn-income:hover {
            background-color: var(--income-primary);
            opacity: 0.9;
        }

        .btn-income-light:hover {
            background-color: var(--income-light);
            opacity: 0.9;
        }

        /* ===== FOOTER NAV ===== */
        footer {
        backdrop-filter: blur(10px);
        }

        footer .nav-link {
            text-decoration: none;
            padding: 0.5rem;
            color: var(--text-dark);

            transform 0.4s;
            position: relative;
        }

        footer .nav-link:hover {
            transform: translateY(-5px);
        }

        footer .nav-link.active {
            background-color: rgba(127, 113, 191, 0.3);
            border-radius: 8px;
            transform: translateY(-3px);
            color: var(--text-dark);
        }

        /* ===== UTILITIES ===== */
        .text-value {
            font-size: 1.75rem;
            font-weight: 600;
            margin: 0;
        }

        .text-label {
            font-size: 0.875rem;
            opacity: 0.8;
            margin-bottom: 0.25rem;
        }

        .divider-vertical {
            border-right: 2px solid var(--border-color);
        }


    </style>
</head>

<body>
    <main class="pb-5">
        <div class="container-fluid">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show mt-1">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% block content %}
        {% endblock %}
        </div>
    </main>

    <footer class="navbar fixed-bottom border-top">
        <div class="container-fluid">
            <div class="row text-center w-100 m-0">
                <div class="col">
                    <a class="nav-link rounded {% if request.resolver_match.url_name == 'expense_list' %}active{% endif %}" href="{% url 'expense_list' %}">Expense</a>
                </div>
                <div class="col">
                    <a class="nav-link rounded {% if request.resolver_match.url_name == 'add_expense' %}active{% endif %}" href="{% url 'add_expense' %}">Add</a>
                </div>
                <div class="col">
                    <a class="nav-link rounded {% if request.resolver_match.url_name == 'summary' %}active{% endif %}" href="{% url 'summary' %}">User</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
