<!--template/partials/headers.html-->

<header class="shadow-sm">
    <span class="appname">BudgetApp</span>

    {% if selected_currency == 'MMK' %}
        <div>
        <button class="header-btn-rate">
            <span>128 MMK</span>
        </button>
        </div>
    {% endif %}

    <div class="d-flex gap-2">

        <!-- Shopping List Button -->
        <div class="dropdown">
            <button class="header-btn position-relative" data-bs-toggle="dropdown" aria-expanded="false">
                {% if shopping_count == 0 %}
                <i class="bi bi-cart"></i>
                {% else %}
                <span class="badge">{{ shopping_count }}</span>
                {% endif %}
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-header text-center" href="{% url 'shopping_page' %}"><small>Shopping List > </small></a></li>
                {% for item in shopping %}
                <li class="dropdown-item-text">{{ item.item }}</li>
                {% endfor %}
            </ul>
        </div>

        <!-- Currency Button -->
        <div class="dropdown">
            <button class="header-btn" data-bs-toggle="dropdown" aria-expanded="false">
                {% if selected_currency == 'MMK' %}
                    <span><small>K</small></span>
                {% else %}
                    <i class="bi bi-currency-exchange"></i>
                {% endif %}

            </button>
            <div class="dropdown-menu dropdown-menu-end">
                <form method="POST" action="{% url 'set_currency' %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.path }}">
                    <button class="dropdown-item" name="currency" value="THB">THB</button>
                    <button class="dropdown-item" name="currency" value="MMK">MMK</button>
                </form>

            </div>
        </div>

    </div>
</header>
