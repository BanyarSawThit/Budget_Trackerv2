{% extends 'base.html' %}

{% block content %}

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-deposit shadow">
                <div class="card-header text-center bg-danger text-white">
                    <h5 class="mb-0">Delete Deposit</h5>
                </div>
                <div class="card-body">
                    <p class="text-center mb-4">Are you sure you want to delete this deposit entry?</p>

                    <div class="alert alert-light">
                        <p class="mb-1"><strong>Amount:</strong> {{ item.amount|floatformat:0 }}</p>
                        <p class="mb-1"><strong>Date:</strong> {{ item.date }}</p>
                        <p class="mb-0"><strong>Description:</strong> {{ item.description|default:"No description" }}</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100">Yes, Delete</button>
                        <a href="{% url 'deposit_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
