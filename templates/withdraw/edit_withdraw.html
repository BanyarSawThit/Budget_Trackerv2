{% extends 'base.html' %}

{% block content %}

<div class="container mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-budget shadow">
                <div class="card-header">
                    <h5 class="mb-0">Edit Withdrawal</h5>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <strong>Editing:</strong> {{ item.amount|floatformat:0 }} from {{ item.date }}
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-warning btn-lg w-100 mt-2">Update</button>
                    </form>

                    <a href="{% url 'withdraw_list' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
